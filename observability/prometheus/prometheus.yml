rule_files:
  - ./rules/*.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: task-service
    static_configs:
      - targets: ["task-service:8000"]

  - job_name: webhook-receiver
    static_configs:
      - targets: ["webhook-receiver:8000"]

  - job_name: external-service-simulator
    static_configs:
      - targets: ["external-service-simulator:8001"]

  - job_name: webhook-dispatcher
    static_configs:
      - targets: ["webhook-dispatcher:9100"]

  - job_name: notification-worker
    static_configs:
      - targets: ["notification-worker:9100"]

  - job_name: scheduler-worker
    static_configs:
      - targets: ["scheduler-worker:9100"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
