# Custom queries for prometheuscommunity/postgres-exporter.
# Loaded via PG_EXPORTER_EXTEND_QUERY_PATH (mounted at /etc/postgres-exporter/queries.yaml).
#
# Metric naming: {query_name}_{metric_name}
# e.g. pg_connections_by_state / count → pg_connections_by_state_count

# ---------------------------------------------------------------------------
# Connection breakdown by state (active / idle / idle in transaction / …)
# Allows watching idle-in-transaction spikes which indicate hung transactions.
# ---------------------------------------------------------------------------
pg_connections_by_state:
  query: |
    SELECT
      COALESCE(state, 'other') AS state,
      COUNT(*)                 AS count
    FROM pg_stat_activity
    WHERE datname = current_database()
    GROUP BY state
  metrics:
    - state:
        usage: LABEL
        description: "Connection state (active, idle, idle in transaction, …)"
    - count:
        usage: GAUGE
        description: "Number of connections in this state"

# ---------------------------------------------------------------------------
# Slow queries — currently executing queries that have been running > 1 s.
# A sustained non-zero value usually means a missing index or lock contention.
# ---------------------------------------------------------------------------
pg_slow_queries:
  query: |
    SELECT COUNT(*) AS count
    FROM pg_stat_activity
    WHERE state = 'active'
      AND query NOT LIKE '%pg_stat_activity%'
      AND NOW() - query_start > INTERVAL '1 second'
  metrics:
    - count:
        usage: GAUGE
        description: "Queries currently executing for more than 1 second"

# ---------------------------------------------------------------------------
# Query latency percentiles from pg_stat_statements.
# Requires:
#   1. PostgreSQL started with shared_preload_libraries = 'pg_stat_statements'
#   2. CREATE EXTENSION pg_stat_statements (see infra/postgres/init.sql)
#
# percentile_disc(x) WITHIN GROUP (ORDER BY mean_exec_time) calculates the
# x-th percentile across all unique query fingerprints' mean execution times.
# This is "p95 of average query latencies" — a good proxy for tail latency.
#
# If pg_stat_statements is not available this query will return an error and
# the exporter will expose an error metric; the other queries are unaffected.
# ---------------------------------------------------------------------------
pg_query_latency_percentiles:
  query: |
    SELECT
      COALESCE(
        percentile_disc(0.50) WITHIN GROUP (ORDER BY mean_exec_time), 0
      ) / 1000.0 AS p50_seconds,
      COALESCE(
        percentile_disc(0.95) WITHIN GROUP (ORDER BY mean_exec_time), 0
      ) / 1000.0 AS p95_seconds,
      COALESCE(
        percentile_disc(0.99) WITHIN GROUP (ORDER BY mean_exec_time), 0
      ) / 1000.0 AS p99_seconds
    FROM pg_stat_statements
    JOIN pg_database d ON d.oid = dbid
    WHERE d.datname = current_database()
      AND calls > 5
  master: true
  metrics:
    - p50_seconds:
        usage: GAUGE
        description: "p50 of per-query mean execution times (seconds)"
    - p95_seconds:
        usage: GAUGE
        description: "p95 of per-query mean execution times (seconds)"
    - p99_seconds:
        usage: GAUGE
        description: "p99 of per-query mean execution times (seconds)"
