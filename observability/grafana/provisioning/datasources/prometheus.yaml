apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      # When Grafana encounters an exemplar with label "TraceID" on any histogram
      # panel it will open the trace in Jaeger using the datasource below.
      exemplarTraceIdDestinations:
        - name: TraceID
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    editable: true

  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: false
    editable: true
    jsonData:
      index: "saas-debug-lab-*"
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
      esVersion: "8.0.0"
      derivedFields:
        # matcherType: label means Grafana looks for a log field named
        # "trace_id" rather than running a regex on the message text.
        # The matched value is passed to the Jaeger datasource as a trace ID.
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "${__value.raw}"
          datasourceUid: jaeger
          urlDisplayLabel: "Open trace in Jaeger"
