apiVersion: 1

groups:
  - orgId: 1
    name: SaaS Debug Lab — Critical
    folder: Alerts
    interval: 30s

    rules:

# ----------------------------
# SERVICE DOWN
# ----------------------------
      - uid: service-down
        title: "Service Down (any instance)"
        condition: B
        for: 2m
        noDataState: Alerting
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is not responding"
          dashboard: "http://127.0.0.1:3000/d/global-overview-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 60, to: 0 }
            model:
              instant: true
              expr: |
                min by (job) (
                  up{
                    job=~"api-gateway|task-service|auth-service|webhook-dispatcher|notification-worker|scheduler-worker|external-service-simulator"
                  }
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }


# ----------------------------
# HTTP ERROR RATE
# ----------------------------
      - uid: http-error-rate
        title: "HTTP Error Rate > 5%"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} HTTP 5xx error rate exceeded 5%"
          dashboard: "http://127.0.0.1:3000/d/service-drilldown-v2?var-job={{ $labels.job }}"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#2-high-api-latency"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                (
                  sum by (job) (
                    rate(http_requests_total{status=~"5.."}[5m])
                  )
                  /
                  clamp_min(
                    sum by (job) (
                      rate(http_requests_total[5m])
                    ),
                    0.001
                  )
                ) * 100

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }


# ----------------------------
# UPSTREAM ERROR RATE
# ----------------------------
      - uid: upstream-error-rate
        title: "Upstream Error Rate > 5%"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Upstream calls to {{ $labels.service }} failing above 5%"
          dashboard: "http://127.0.0.1:3000/d/service-drilldown-v2?var-job=api-gateway"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#6-external-api-failures"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                (
                  sum by (service) (
                    rate(upstream_requests_total{status=~"5.."}[5m])
                  )
                  /
                  clamp_min(
                    sum by (service) (
                      rate(upstream_requests_total[5m])
                    ),
                    0.001
                  )
                ) * 100

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }


# ----------------------------
# WEBHOOK FAILURE RATE
# ----------------------------
      - uid: webhook-failure-rate
        title: "Webhook Failure Rate > 5%"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Webhook delivery failure rate exceeded 5% — check DLQ"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#1-webhooks-not-delivered"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                (
                  sum by (job) (
                    rate(webhook_requests_total{status="fail"}[5m])
                  )
                  /
                  clamp_min(
                    sum by (job) (
                      rate(webhook_requests_total[5m])
                    ),
                    0.001
                  )
                ) * 100

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }


# ----------------------------
# KAFKA PROCESSING ERRORS
# ----------------------------
      - uid: kafka-processing-errors
        title: "Kafka Processing Errors Detected"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: "Kafka message processing errors detected in {{ $labels.job }}"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#4-kafka-lag-increasing"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (
                  rate(kafka_processing_errors_total[5m])
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
