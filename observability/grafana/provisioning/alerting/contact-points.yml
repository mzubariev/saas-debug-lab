apiVersion: 1

contactPoints:
    - orgId: 1
      name: telegram
      receivers:
        - uid: telegram-receiver
          type: telegram
          settings:
            bottoken: ${TELEGRAM_BOT_TOKEN}
            chatid: "${TELEGRAM_CHAT_ID}"
            parseMode: "HTML"
            disable_web_page_preview: true
            message: |
              <b>{{ .Status | toUpper }}{{ if eq .Status "firing" }} 🔥{{ else }} ✅{{ end }}</b>

              {{ range .Alerts }}
              <b>{{ .Labels.alertname }}</b>
              {{ if .Annotations.summary }}📋 {{ .Annotations.summary | html }}{{ end }}
              {{ if .Annotations.description }}💬 {{ .Annotations.description | html }}{{ end }}
              🏷 Severity: <code>{{ .Labels.severity }}</code>
              {{ if .Labels.job }}🔧 Service: <code>{{ .Labels.job }}</code>{{ end }}
              {{ if .Annotations.dashboard }}🔗 <a href="{{ .Annotations.dashboard | html }}">Open Dashboard</a>{{ end }}
              {{ if .Annotations.runbook }}📖 <a href="{{ .Annotations.runbook | html }}">Runbook</a>{{ end }}
              {{ end }}