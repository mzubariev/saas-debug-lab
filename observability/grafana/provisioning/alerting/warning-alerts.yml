apiVersion: 1

groups:
  - orgId: 1
    name: SaaS Debug Lab — Warning
    folder: Alerts
    interval: 1m

    rules:

# ----------------------------
# LATENCY
# ----------------------------
      - uid: high-latency
        title: "P95 Latency > 1s"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} P95 latency exceeded 1s"
          dashboard: "http://127.0.0.1:3000/d/service-drilldown-v2?var-job={{ $labels.job }}"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#2-high-api-latency"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                histogram_quantile(0.95,
                  sum by (job, le) (
                    rate(http_request_duration_seconds_bucket[5m])
                  )
                )
                AND
                sum by (job) (
                  rate(http_requests_total[5m])
                ) > 1

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }


# ----------------------------
# TRAFFIC
# ----------------------------
      - uid: zero-traffic
        title: "No Traffic Detected"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "No HTTP traffic detected for {{ $labels.job }}"
          dashboard: "http://127.0.0.1:3000/d/global-overview-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (
                  rate(http_requests_total[5m])
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: eq, params: [0] }


# ----------------------------
# KAFKA LAG
# ----------------------------
      - uid: kafka-lag
        title: "Kafka Lag > 500 messages"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer group {{ $labels.consumergroup }} is {{ $value }} messages behind on {{ $labels.topic }} — pipeline backing up"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#4-kafka-lag-increasing"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (consumergroup, topic) (kafka_consumergroup_lag)

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [500] }


# ----------------------------
# DLQ
# ----------------------------
      - uid: dlq-growth
        title: "DLQ Growing"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Webhook DLQ is receiving new messages — deliveries permanently failing"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#1-webhooks-not-delivered"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (
                  increase(dlq_messages_total[5m])
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }


# ----------------------------
# CELERY
# ----------------------------
      - uid: celery-backlog
        title: "Celery Queue Backlog"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog — tasks are accumulating faster than workers consume"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (celery_queue_size)
                /
                clamp_min(
                  sum by (job) (celery_active_tasks),
                  1
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }


# ----------------------------
# FILE DESCRIPTORS
# ----------------------------
      - uid: fd-exhaustion
        title: "FD Usage > 80%"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} file descriptor usage above 80% — risk of connection exhaustion"
          dashboard: "http://127.0.0.1:3000/d/resources-deps-v2?var-job={{ $labels.job }}"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                max by (job) (
                  process_open_fds{job!=""}
                  /
                  process_max_fds{job!=""}
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }


# ----------------------------
# CPU SATURATION
# ----------------------------
      - uid: cpu-saturation
        title: "CPU Saturation > 80%"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} CPU saturation above 80% of machine cores — runaway loop or overload"
          dashboard: "http://127.0.0.1:3000/d/resources-deps-v2?var-job={{ $labels.job }}"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (rate(process_cpu_seconds_total{job!=""}[5m]))
                / on(job) group_left()
                max by (job) (machine_cpu_cores{job!=""})

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }


# ----------------------------
# MEMORY USAGE
# ----------------------------
      - uid: memory-usage
        title: "Memory Usage > 85% of Limit"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} memory usage above 85% of container limit — OOM risk"
          dashboard: "http://127.0.0.1:3000/d/resources-deps-v2?var-job={{ $labels.job }}"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                (
                  sum by (job) (process_resident_memory_bytes{job!=""})
                  /
                  on(job) group_left()
                  max by (job) (container_memory_limit_bytes{job!=""})
                )
                and
                max by (job) (container_memory_limit_bytes{job!=""}) > 0

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.85] }


# ----------------------------
# TASK PROCESSING LATENCY
# ----------------------------
      - uid: task-processing-latency
        title: "Task DB Operation P95 > 200ms"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "task-service DB operation p95 latency above 200ms — slow DB, lock contention, or index missing"
          description: "PromQL threshold is 0.2 (seconds) = 200ms. Uses task_processing_duration_seconds (app histogram)."
          dashboard: "http://127.0.0.1:3000/d/resources-deps-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                histogram_quantile(0.95,
                  sum by (operation, le) (
                    rate(task_processing_duration_seconds_bucket[5m])
                  )
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.2] }


# ----------------------------
# POSTGRES CONNECTIONS
# ----------------------------
      - uid: pg-connection-saturation
        title: "DB Connections > 80% of max_connections"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connection count above 80% of max_connections — risk of 'too many connections' errors"
          dashboard: "http://127.0.0.1:3000/d/resources-deps-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum(pg_connections_by_state_count)
                /
                pg_settings_max_connections

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.8] }


# ----------------------------
# POSTGRES SLOW QUERIES
# ----------------------------
      - uid: pg-slow-queries
        title: "Slow DB Queries Detected (> 1s)"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL has queries running for more than 1 second — possible missing index or lock contention"
          dashboard: "http://127.0.0.1:3000/d/resources-deps-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                pg_slow_queries_count

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }


# ----------------------------
# DLQ RETRY FAILURE RATE
# ----------------------------
      - uid: dlq-retry-failures
        title: "DLQ Retry Failure Rate > 30%"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "More than 30% of DLQ retry deliveries are failing — external endpoint may be rejecting payloads"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#1-webhooks-not-delivered"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum(rate(dlq_retry_result_total{result="failure"}[5m]))
                /
                clamp_min(sum(rate(dlq_retry_result_total[5m])), 1e-9)

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.3] }


# ----------------------------
# AUTH ERROR RATE
# ----------------------------
      - uid: auth-401-spike
        title: "Auth 401 > 10%"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "auth-service 401 Unauthorized rate exceeded 10% — possible credential storm or attack"
          dashboard: "http://127.0.0.1:3000/d/service-drilldown-v2?var-job=auth-service"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                (
                  sum by (job) (
                    rate(upstream_requests_total{
                      service="auth-service",
                      status="401"
                    }[5m])
                  )
                  /
                  clamp_min(
                    sum by (job) (
                      rate(upstream_requests_total{
                        service="auth-service"
                      }[5m])
                    ),
                    0.001
                  )
                ) * 100

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
