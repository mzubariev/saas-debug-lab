apiVersion: 1

groups:
  - orgId: 1
    name: SaaS Debug Lab — Warning
    folder: Alerts
    interval: 1m

    rules:

# ----------------------------
# LATENCY
# ----------------------------
      - uid: high-latency
        title: "P95 Latency > 1s"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} P95 latency exceeded 1s"
          dashboard: "http://127.0.0.1:3000/d/service-drilldown-v2?var-job={{ $labels.job }}"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#2-high-api-latency"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                histogram_quantile(0.95,
                  sum by (job, le) (
                    rate(http_request_duration_seconds_bucket[5m])
                  )
                )
                AND
                sum by (job) (
                  rate(http_requests_total[5m])
                ) > 1

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [1] }


# ----------------------------
# TRAFFIC
# ----------------------------
      - uid: zero-traffic
        title: "No Traffic Detected"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "No HTTP traffic detected for {{ $labels.job }}"
          dashboard: "http://127.0.0.1:3000/d/global-overview-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (
                  rate(http_requests_total[5m])
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: eq, params: [0] }


# ----------------------------
# KAFKA LAG
# ----------------------------
      - uid: kafka-lag
        title: "Kafka Lag > 60s"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag in {{ $labels.job }} is above 60s — pipeline backing up"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#4-kafka-lag-increasing"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (kafka_consumer_lag)
                /
                clamp_min(
                  sum by (job) (rate(kafka_messages_consumed_total[5m])),
                  0.001
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [60] }


# ----------------------------
# DLQ
# ----------------------------
      - uid: dlq-growth
        title: "DLQ Growing"
        condition: B
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Webhook DLQ is receiving new messages — deliveries permanently failing"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md#1-webhooks-not-delivered"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (
                  increase(dlq_messages_total[5m])
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }


# ----------------------------
# CELERY
# ----------------------------
      - uid: celery-backlog
        title: "Celery Queue Backlog"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Celery queue backlog — tasks are accumulating faster than workers consume"
          dashboard: "http://127.0.0.1:3000/d/pipelines-v2"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                sum by (job) (celery_queue_size)
                /
                clamp_min(
                  sum by (job) (celery_active_tasks),
                  1
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [5] }


# ----------------------------
# FILE DESCRIPTORS
# ----------------------------
      - uid: fd-exhaustion
        title: "FD Usage > 80%"
        condition: B
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} file descriptor usage above 80% — risk of connection exhaustion"
          dashboard: "http://127.0.0.1:3000/d/resources-deps-v2?var-job={{ $labels.job }}"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                avg by (job) (
                  process_open_fds
                  /
                  process_max_fds
                  * 100
                )

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [80] }


# ----------------------------
# AUTH ERROR RATE
# ----------------------------
      - uid: auth-401-spike
        title: "Auth 401 > 10%"
        condition: B
        for: 3m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "auth-service 401 Unauthorized rate exceeded 10% — possible credential storm or attack"
          dashboard: "http://127.0.0.1:3000/d/service-drilldown-v2?var-job=auth-service"
          runbook: "https://github.com/YOUR_GITHUB_REPO/blob/main/docs/6_2_INCIDENT_PLAYBOOKS.md"

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model:
              instant: true
              expr: |
                (
                  sum by (job) (
                    rate(upstream_requests_total{
                      service="auth-service",
                      status="401"
                    }[5m])
                  )
                  /
                  clamp_min(
                    sum by (job) (
                      rate(upstream_requests_total{
                        service="auth-service"
                      }[5m])
                    ),
                    0.001
                  )
                ) * 100

          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [10] }
