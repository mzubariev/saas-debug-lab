[SERVICE]
    Flush           5
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Path_Key          source_path
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Read_From_Head    False
    DB                /var/log/fluentbit/docker.db

# Split stderr out before the stdout pipeline.
# Records tagged "stderr" do NOT match "docker.*" so they bypass all stdout filters below.
[FILTER]
    Name   rewrite_tag
    Match  docker.*
    Rule   stream stderr stderr false

# Only stdout
[FILTER]
    Name    grep
    Match   docker.*
    Regex   stream ^stdout$

# Parse JSON from the log field
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        structlog_json
    Reserve_Data  On
    Preserve_Key  Off

# Only structured logs with the level field
[FILTER]
    Name    grep
    Match   docker.*
    Regex   level ^(debug|info|warning|error|critical)$

# Remove health/metrics
[FILTER]
    Name    grep
    Match   docker.*
    Exclude path ^/(health|metrics|readyz|livez)$

# Clean technical fields
[FILTER]
    Name       record_modifier
    Match      docker.*
    Remove_key stream
    Remove_key source_path

[FILTER]
    Name    modify
    Match   docker.*
    Rename  event event_name
    Remove  event.name
    Add     log_source app

[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     saas-debug-lab
    Logstash_DateFormat %Y.%m.%d
    Time_Key            @timestamp
    Time_Key_Format     %Y-%m-%dT%H:%M:%S.%LZ
    Suppress_Type_Name  On
    Trace_Error         On
    Buffer_Size         10MB
    Retry_Limit         5

# ---------------------------------------------------------------------------
# stderr pipeline
# Catches uvicorn crash tracebacks, startup failures, and any other process
# output that goes to stderr rather than the structured stdout JSON pipeline.
# Records land in the same saas-debug-lab index with level=error so a single
# Kibana search covers both structured app logs and raw crash output.
# ---------------------------------------------------------------------------

# Drop blank lines (Docker emits an empty stderr record on process start).
[FILTER]
    Name    grep
    Match   stderr
    Regex   log .+

# Drop Celery/Beat internal framework lines written in Celery text format.
# These are OTel exporter retries, scheduler task dispatches, etc. — not
# application code errors.  App code uses structlog JSON on stdout and never
# reaches this pipeline.  Pattern: [YYYY-MM-DD HH:MM:SS,mmm: LEVEL/Process]
[FILTER]
    Name    grep
    Match   stderr
    Exclude log ^\[20[0-9][0-9]-[0-9][0-9]-[0-9][0-9] [0-9][0-9]:[0-9][0-9]:[0-9][0-9],[0-9]+:

# Rename raw text to message; remove Docker housekeeping fields.
[FILTER]
    Name         record_modifier
    Match        stderr
    Remove_key   stream
    Remove_key   source_path

[FILTER]
    Name    modify
    Match   stderr
    Rename  log message
    Add     level error
    Add     log_source stderr

[OUTPUT]
    Name                es
    Match               stderr
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     saas-debug-lab
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name  On
    Trace_Error         On
    Buffer_Size         10MB
    Retry_Limit         5