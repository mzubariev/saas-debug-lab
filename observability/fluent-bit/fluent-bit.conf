[SERVICE]
    Flush           5
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Path_Key          source_path
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On
    Read_From_Head    False
    DB                /var/log/fluentbit/docker.db

# Only stdout
[FILTER]
    Name    grep
    Match   docker.*
    Regex   stream ^stdout$

# Parse JSON from the log field
[FILTER]
    Name          parser
    Match         docker.*
    Key_Name      log
    Parser        structlog_json
    Reserve_Data  On
    Preserve_Key  Off

# Only structured logs with the level field
[FILTER]
    Name    grep
    Match   docker.*
    Regex   level ^(debug|info|warning|error|critical)$

# Remove health/metrics
[FILTER]
    Name    grep
    Match   docker.*
    Exclude path ^/(health|metrics|readyz|livez)$

# Clean technical fields
[FILTER]
    Name       record_modifier
    Match      docker.*
    Remove_key stream
    Remove_key source_path

[FILTER]
    Name    modify
    Match   docker.*
    Rename  event event_name
    Remove  event.name

[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     saas-debug-lab
    Logstash_DateFormat %Y.%m.%d
    Time_Key            @timestamp
    Time_Key_Format     %Y-%m-%dT%H:%M:%S.%LZ
    Suppress_Type_Name  On
    Trace_Error         On
    Buffer_Size         10MB
    Retry_Limit         5