[SERVICE]
    Flush           5
    Log_Level       info
    Daemon          Off
    Parsers_File    /fluent-bit/etc/parsers.conf

############################
# INPUT
# Read all Docker container log files.
############################

[INPUT]
    Name            tail
    Tag             docker.*
    Path            /var/lib/docker/containers/*/*.log
    Parser          docker
    Docker_Mode     On
    Mem_Buf_Limit   5MB
    Skip_Long_Lines On
    Refresh_Interval 10

############################
# FILTER 1
# Keep only lines whose log field looks like JSON.
# This drops noise from Kafka, Postgres, Zookeeper, etc.
############################

[FILTER]
    Name            grep
    Match           docker.*
    Regex           log ^\{

############################
# FILTER 2
# Parse the inner JSON produced by structlog.
# Extracts: event, level, service, timestamp, and any extra fields.
############################

[FILTER]
    Name            parser
    Match           docker.*
    Key_Name        log
    Parser          structlog_json
    Reserve_Data    On

############################
# OUTPUT
# Ship to Elasticsearch.
# Suppress_Type_Name is required for ES 8.x (types were removed).
############################

[OUTPUT]
    Name            es
    Match           docker.*
    Host            elasticsearch
    Port            9200
    Index           saas-debug-lab
    Suppress_Type_Name On
    tls             Off
    Retry_Limit     3
