[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saas-shared"
version = "0.1.0"
description = "Shared utilities for saas-debug-lab services and workers"
requires-python = ">=3.11"

# Minimal core: only structlog for logging (used by all services AND workers).
dependencies = [
    "structlog",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Install for FastAPI services that need tracing, /health router, and async Redis helpers.
services = [
    "fastapi",
    "redis[asyncio]",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["saas_shared*"]
