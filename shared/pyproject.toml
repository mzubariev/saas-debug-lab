[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "saas-shared"
version = "0.1.0"
description = "Shared utilities for saas-debug-lab services and workers"
requires-python = ">=3.11"

# Minimal core: only structlog for logging (used by all services AND workers).
dependencies = [
    "structlog",
]

[project.optional-dependencies]
# Install for FastAPI services that need tracing and a /health router.
services = [
    "fastapi",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["saas_shared*"]
