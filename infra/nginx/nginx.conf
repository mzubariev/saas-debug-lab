# =============================================================================
# SaaS Debug Lab — Nginx reverse proxy
# Sits in front of api-gateway and is the sole host-facing entry point on :80.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 180;

    # ─── Logging ─────────────────────────────────────────────────────────────
    # JSON-structured access log so Fluent Bit can parse it without a custom
    # parser. Errors go to stderr so Docker captures them.
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /dev/stdout json_combined;
    error_log  /dev/stderr warn;

    # ─── Rate limiting ────────────────────────────────────────────────────────
    # General API zone: 10 req/s per client IP, 10 MB shared memory
    # (~160 000 unique IPs per MB using binary_remote_addr).
    limit_req_zone $http_authorization zone=api:10m rate=20r/s;

    # Tighter zone for auth endpoints to limit brute-force attempts.
    limit_req_zone $http_authorization zone=auth:10m    rate=5r/m;

    # HTTP 429 Too Many Requests on rate-limit breach (RFC 6585).
    limit_req_status 429;

    # ─── Upstream ─────────────────────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8000;

        # Keep up to 32 idle upstream connections open so that the TCP
        # handshake cost is paid once, not per request.
        keepalive 32;
    }

    # ─── Server ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ─── Timeouts ──────────────────────────────────────────────────────────
        # connect: how long to wait while establishing a connection to upstream.
        proxy_connect_timeout  5s;
        # send: how long to wait while transmitting a request to upstream.
        proxy_send_timeout    10s;
        # read: how long to wait for upstream to send a response.
        # 30 s covers slow DB queries without hanging connections indefinitely.
        proxy_read_timeout    30s;

        # ─── Buffering ─────────────────────────────────────────────────────────
        # Buffer upstream responses in memory before forwarding to the client.
        # Reduces upstream connections held open by slow clients.
        proxy_buffering         on;
        proxy_buffer_size       16k;   # first-chunk buffer (headers)
        proxy_buffers           4 16k; # additional response body buffers
        proxy_busy_buffers_size 32k;   # max sent to client while response is buffered

        # ─── Common proxy settings ─────────────────────────────────────────────
        proxy_http_version 1.1;
        # Clear Connection so upstream keep-alives work correctly.
        proxy_set_header Connection "";

        # Forward client identity so services can log real IPs.
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        # W3C trace context (traceparent, tracestate) passes through to api-gateway by default.

        # ─── Auth endpoints — stricter rate limit ──────────────────────────────
        # 5 login attempts per minute per IP; burst of 3 before hard reject.
        location /auth/token {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://api_gateway;
        }

        # exclude other auth (/auth/me) endpoints from rate limiting
        location /auth/ {
            proxy_pass http://api_gateway;
        }

        # ─── All other API traffic ─────────────────────────────────────────────
        # 50 req/s per IP; burst of 100 served immediately, then rate-limited.
        location / {
            limit_req zone=api burst=100;
            proxy_pass http://api_gateway;
        }

        location /webhooks/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api_gateway;
        }

        location /external/ {
            proxy_pass http://external-service-simulator:8000/;
        }

        location /otel/ {
            limit_req zone=api burst=20 nodelay;
            client_max_body_size 1m;
            proxy_pass http://otel-collector:4318/;
        }
    }
}
