# Datadog APM only — use together with docker-compose.yml. Do not combine with the
# `observability` profile (Jaeger / OpenTelemetry Collector); tracing modes are switched
# only by compose files, never mixed at runtime.
#
# Requires:
#   - DD_API_KEY (or DATADOG_API_KEY) in infra/.env
#
# Example:
#   cd infra
#   docker compose -f docker-compose.yml -f docker-compose.datadog.yml --profile core --profile datadog up -d

version: "3.9"

services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: datadog-agent
    restart: unless-stopped
    profiles: ["datadog"]
    environment:
      DD_API_KEY: ${DD_API_KEY:-${DATADOG_API_KEY:-}}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_PROCESS_AGENT_ENABLED: "true"
      DD_ENV: ${DD_ENV:-dev}
    ports:
      - "8126:8126"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro

  api-gateway:
    command: ["ddtrace-run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: api-gateway
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"api-gateway"}]'

  auth-service:
    command: ["ddtrace-run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: auth-service
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"auth-service"}]'

  task-service:
    command: ["ddtrace-run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: task-service
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"task-service"}]'

  integration-service:
    command: ["ddtrace-run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: integration-service
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"integration-service"}]'

  external-service-simulator:
    command: ["ddtrace-run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload", "--no-access-log"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: external-service-simulator
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"external-service-simulator"}]'

  webhook-dispatcher:
    command: ["ddtrace-run", "python", "-m", "app.run"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: webhook-dispatcher
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"webhook-dispatcher"}]'

  notification-worker:
    command: ["ddtrace-run", "python", "-m", "app.worker"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: notification-worker
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"notification-worker"}]'

  scheduler-worker:
    command:
      [
        "ddtrace-run",
        "celery",
        "-A",
        "app.core.celery:celery_app",
        "worker",
        "--beat",
        "--loglevel=info",
      ]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: scheduler-worker
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"scheduler-worker"}]'

  flower:
    command: ["ddtrace-run", "celery", "-A", "app.core.celery:celery_app", "flower", "--port=5555"]
    environment:
      DD_TRACE_ENABLED: "true"
      DD_AGENT_HOST: datadog-agent
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: flower
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"flower"}]'
