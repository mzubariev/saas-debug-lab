# Test-stack override. Does not change `docker compose --profile core`.
#
# Project `saas-test` (the lab project is the directory name `infra`). `down -v` only
# removes this project's volumes. `container_name` is reset. Compose 2.19 appends
# port sequences and ignores `!override`, so lab host ports are cleared here with
# `!reset []` and republished by `docker-compose.test.ports.yml` (nginx 9080,
# frontend 5174 / `UI_URL`, simulator 8002, mailhog 8026, toxiproxy 8475).
#
# Explicit service list (not the whole core profile; exporters stay out):
# infra/test-stack.services
#
#   docker compose -p saas-test -f docker-compose.yml -f docker-compose.test.yml \
#     -f docker-compose.test.ports.yml up -d --build \
#     $(grep -v '^#' test-stack.services)
#
# Frontend uses the Dockerfile `preview` stage (`vite build` then `vite preview`).
# Workers have no HTTP app; the test kit checks their metrics port.
# nginx.conf is not modified. Host ports below are for seeding, KafkaEventReader, and readiness.
# No service reads a gitignored .env. Required variables are set below.

name: saas-test

x-telemetry: &telemetry
  OTLP_ENDPOINT: ""
  SENTRY_DSN: ""

services:
  postgres:
    container_name: !reset null
    # ADR-18, plus the preload the init script needs. Data dir is tmpfs (PGDATA),
    # because this Compose version appends volumes and cannot drop postgres_data.
    environment:
      PGDATA: /tmp/pgdata
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: saas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d saas"]
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
      -c max_connections=200
    tmpfs:
      - /tmp/pgdata:rw,nosuid,size=1g,mode=0777
    ports:
      - "5434:5432"

  redis:
    container_name: !reset null
    ports:
      - "6381:6379"

  kafka:
    container_name: !reset null
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9095
    ports:
      - "9095:9093"

  api-gateway:
    container_name: !reset null
    image: infra-api-gateway:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: api-gateway
      JWT_SECRET: dev-secret-change-in-production
      AUTH_SERVICE_URL: http://auth-service:8000
      TASK_SERVICE_URL: http://task-service:8000
      INTEGRATION_SERVICE_URL: http://webhook-receiver:8000
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
    ports:
      - "8010:8000"

  auth-service:
    container_name: !reset null
    image: infra-auth-service:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: auth-service
      JWT_SECRET: dev-secret-change-in-production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: saas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      REDIS_URL: redis://redis:6379/1

  task-service:
    container_name: !reset null
    image: infra-task-service:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: task-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: saas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  webhook-receiver:
    container_name: !reset null
    image: infra-webhook-receiver:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: webhook-receiver
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  webhook-dispatcher:
    container_name: !reset null
    image: infra-webhook-dispatcher:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: webhook-dispatcher
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONSUMER_GROUP: webhook-dispatcher
      WEBHOOK_URL: http://wiremock:8080/external/receive-webhook
      WEBHOOK_BACKOFF_BASE: "0.2"
    ports:
      - "9111:9100"
    depends_on:
      wiremock:
        condition: service_started

  notification-worker:
    container_name: !reset null
    image: infra-notification-worker:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: notification-worker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: toxiproxy
      SMTP_PORT: "11025"
      EMAIL_FROM: notifications@saas-debug-lab.local
      EMAIL_TO: your-uuid@emailhook.site
    ports:
      - "9112:9100"

  external-service-simulator:
    container_name: !reset null
    image: infra-external-service-simulator:latest
    # localhost inside this container is not the gateway. The lab file uses that host URL.
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: external-service-simulator
      INTEGRATION_SERVICE_WEBHOOK_URL: http://api-gateway:8000/webhooks/inbound
    ports: !reset []

  scheduler-worker:
    container_name: !reset null
    image: infra-scheduler-worker:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      SERVICE_NAME: scheduler-worker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: saas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WEBHOOK_URL: http://wiremock:8080/external/receive-webhook
      DLQ_REPLAY_INTERVAL_SECONDS: "5"
      CLEANUP_INTERVAL_SECONDS: "10"
    ports:
      - "9113:9100"
    depends_on:
      wiremock:
        condition: service_started

  migrations:
    container_name: !reset null
    image: infra-migrations:latest
    env_file: !reset []
    environment:
      <<: *telemetry
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: saas
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  frontend:
    container_name: !reset null
    image: infra-frontend:latest
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      target: preview
      args:
        VITE_API_URL: http://127.0.0.1:9080
    ports: !reset []

  nginx:
    container_name: !reset null
    # nginx.conf resolves otel-collector at startup. The test stack does not run it.
    extra_hosts:
      - "otel-collector:127.0.0.1"
    ports: !reset []

  mailhog:
    container_name: !reset null
    ports: !reset []

  toxiproxy:
    container_name: !reset null
    ports: !reset []

  wiremock:
    image: wiremock/wiremock:3.13.1
    container_name: wiremock
    ports:
      - "8089:8080"
