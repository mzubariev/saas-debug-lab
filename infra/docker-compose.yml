version: "3.9"

services:

############################
# DATABASE
############################

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    profiles: ["core"]
    # Enable pg_stat_statements so postgres-exporter can expose per-query latency.
    # track=all includes utility statements (VACUUM, ANALYZE, etc.).
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the pg_stat_statements extension on first initialisation.
      # For existing volumes run manually — see infra/postgres/init.sql header.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_pg_stat_statements.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    profiles: ["core"]
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres-exporter/queries.yaml"
    volumes:
      - ../observability/postgres-exporter/queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

############################
# REDIS
############################

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    profiles: ["core"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

############################
# KAFKA
############################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    profiles: ["core"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

############################
# KAFKA UI
############################

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    profiles: ["core"]
    command:
      - "--kafka.server=kafka:9092"
      - "--web.listen-address=:9308"
    depends_on:
      kafka:
        condition: service_healthy

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

############################
# API GATEWAY
############################

  api-gateway:
    build:
      context: ..
      dockerfile: services/core/api-gateway/Dockerfile
    container_name: api-gateway
    volumes:
      - ../services/core/api-gateway/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/core/api-gateway/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    deploy:
      resources:
        limits:
          memory: 512m
    # Port 8000 is intentionally NOT exposed to the host.
    # All external traffic must enter through Nginx on :80.
    depends_on:
      task-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      webhook-receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

############################
# NGINX (reverse proxy + rate limiter)
############################

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "80:80"     # Sole host-facing entry point — replaces direct :8000 exposure
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

############################
# DB MIGRATIONS (one-shot — single Alembic history for whole DB)
############################

  migrations:
    build:
      context: ..
      dockerfile: migrations/Dockerfile
    container_name: migrations
    volumes:
      - ../migrations/alembic:/app/alembic
    profiles: ["core"]
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../infra/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

############################
# SERVICES
############################

  auth-service:
    build:
      context: ..
      dockerfile: services/core/auth-service/Dockerfile
    container_name: auth-service
    volumes:
      - ../services/core/auth-service/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/core/auth-service/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  task-service:
    build:
      context: ..
      dockerfile: services/core/task-service/Dockerfile
    container_name: task-service
    volumes:
      - ../services/core/task-service/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/core/task-service/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

############################
# WEBHOOK SIMULATOR
############################

  external-service-simulator:
    build:
      context: ..
      dockerfile: services/external/external-service-simulator/Dockerfile
    container_name: external-service-simulator
    volumes:
      - ../services/external/external-service-simulator/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/external/external-service-simulator/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Chaos / load tests: host override (e.g. EXTERNAL_SIMULATOR_DEFAULT_FAIL_RATE=0.95 docker compose up …)
      DEFAULT_FAIL_RATE: ${EXTERNAL_SIMULATOR_DEFAULT_FAIL_RATE:-0.0}
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

############################
# WEBHOOK RECEIVER
############################

  webhook-receiver:
    build:
      context: ..
      dockerfile: services/core/webhook-receiver/Dockerfile
    container_name: webhook-receiver
    volumes:
      - ../services/core/webhook-receiver/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/core/webhook-receiver/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Consumes task_created / task_updated → HTTP delivery + DLQ.
  webhook-dispatcher:
    build:
      context: ..
      dockerfile: services/core/webhook-dispatcher/Dockerfile
    container_name: webhook-dispatcher
    volumes:
      - ../services/core/webhook-dispatcher/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/core/webhook-dispatcher/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: "9100"
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      kafka:
        condition: service_healthy
      external-service-simulator:
        condition: service_healthy

############################
# MAILHOG (local SMTP catcher)
############################

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "8025:8025"   # Web UI — view captured emails at http://localhost:8025
    # Port 1025 is intentionally NOT exposed to the host; traffic goes through Toxiproxy.

############################
# TOXIPROXY (chaos proxy — sits between notification-worker and MailHog)
############################

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: toxiproxy
    restart: unless-stopped
    profiles: ["core"]
    command: ["-config", "/etc/toxiproxy.json", "-host", "0.0.0.0"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "8474:8474"   # Management API — inject/remove toxics here
    depends_on:
      mailhog:
        condition: service_started

############################
# WORKERS
############################

  scheduler-worker:
    build:
      context: ..
      dockerfile: workers/scheduler-worker/Dockerfile
    container_name: scheduler-worker
    volumes:
      - ../workers/scheduler-worker/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    command: [
      "celery", "-A", "app.core.celery:celery_app", "worker",
      "--beat",
      "--loglevel=info",
      "--concurrency=2",
      "--prefetch-multiplier=1"
    ]
    env_file:
      - ../workers/scheduler-worker/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: "9100"
      # Merge Celery prefork Counter/Histogram samples into one /metrics endpoint.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc_scheduler
    deploy:
      resources:
        limits:
          memory: 384m
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  flower:
    build:
      context: ..
      dockerfile: workers/scheduler-worker/Dockerfile
    container_name: flower
    volumes:
      - ../workers/scheduler-worker/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    command: ["celery", "-A", "app.core.celery:celery_app", "flower", "--port=5555"]
    env_file:
      - ../workers/scheduler-worker/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "5555:5555"   # Flower UI — http://localhost:5555
    depends_on:
      redis:
        condition: service_healthy
      scheduler-worker:
        condition: service_started

  notification-worker:
    build:
      context: ..
      dockerfile: workers/notification-worker/Dockerfile
    container_name: notification-worker
    volumes:
      - ../workers/notification-worker/app:/app/app
      - ../shared:/app/shared
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../workers/notification-worker/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      # ── SMTP (via Toxiproxy) ──────────────────────────────────────────────
      # SMTP routes through Toxiproxy by default so network-level chaos can be injected
      # without touching this service. To use a real provider instead:
      #   SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_USE_STARTTLS=true
      #   SMTP_USERNAME=you@gmail.com SMTP_PASSWORD=app-password
      SMTP_HOST: ${SMTP_HOST:-toxiproxy}
      SMTP_PORT: ${SMTP_PORT:-11025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      kafka:
        condition: service_healthy

############################
# FRONTENDS
############################

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: frontend
    volumes:
      - ../frontend/app:/app/app
      - ../frontend/package*.json:/app/package*.json
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/src:/app/src
      - ../frontend/index.html:/app/index.html
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost
      # Forward the host-level SENTRY_DSN so the browser SDK can report to the
      # same Sentry project as the backend.  Leave unset to disable Sentry.
      - VITE_SENTRY_DSN=${SENTRY_DSN:-}
      - VITE_SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    depends_on:
      - nginx


############################
# REDIS INSIGHT
############################

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

############################
# JAEGER
############################

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

############################
# OPENTELEMETRY COLLECTOR (OTLP → Jaeger; host :4317/:4318)
############################

  otel-collector:
    image: otel/opentelemetry-collector:0.96.0
    container_name: otel-collector
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - jaeger
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro

############################
# PROMETHEUS
############################

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro

############################
# GRAFANA
############################

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GRAFANA_BASE_URL: ${GRAFANA_BASE_URL}
      JAEGER_BASE_URL: ${JAEGER_BASE_URL}
      KIBANA_BASE_URL: ${KIBANA_BASE_URL}
      GITHUB_REPO_URL: ${GITHUB_REPO_URL}

############################
# FLUENT BIT
############################

  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: fluent-bit
    user: root
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/fluentbit:/var/log/fluentbit
      - ../observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    logging:
      driver: json-file
    depends_on:
      - elasticsearch

############################
# ELASTICSEARCH
############################

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"

############################
# KIBANA
############################

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

############################
# PYROSCOPE
############################

  pyroscope:
    image: pyroscope/pyroscope:latest
    container_name: pyroscope
    command: server
    restart: unless-stopped
    profiles: ["pyroscope"]
    ports:
      - "4040:4040"
    depends_on:
      - scheduler-worker
      - task-service

############################
# VOLUMES
############################

volumes:
  postgres_data:
  redis_data:
  grafana_data:
