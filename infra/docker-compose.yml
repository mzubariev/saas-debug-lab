version: "3.9"

services:

############################
# DATABASE
############################

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

############################
# REDIS
############################

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "6379:6379"

############################
# KAFKA
############################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    profiles: ["core"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

############################
# KAFKA UI
############################

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

############################
# API GATEWAY
############################

  api-gateway:
    build: ../services/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/api-gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      - task-service

############################
# SERVICES
############################

  auth-service:
    build: ../services/auth-service
    container_name: auth-service
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      - postgres
      - kafka

  task-service:
    build: ../services/task-service
    container_name: task-service
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/task-service/.env
    ports:
      - "8001:8000"
    depends_on:
      - postgres
      - kafka

############################
# WORKERS
############################

  notification-worker:
    build: ../workers/notification-worker
    container_name: notification-worker
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      - redis
      - kafka

  analytics-worker:
    build: ../workers/analytics-worker
    container_name: analytics-worker
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      - kafka

############################
# FRONTENDS
############################

  react-frontend:
    build: ../frontends/react-dashboard
    container_name: react-frontend
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://api-gateway:8000
    depends_on:
      - api-gateway

  nextjs-frontend:
    build: ../frontends/nextjs-dashboard
    container_name: nextjs-frontend
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api-gateway:8000
    depends_on:
      - api-gateway

############################
# REDIS INSIGHT
############################

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "5540:5540"
    depends_on:
      - redis

############################
# PROMETHEUS
############################

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

############################
# GRAFANA
############################

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

############################
# ELASTICSEARCH
############################

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      discovery.type: single-node
    ports:
      - "9200:9200"

############################
# KIBANA
############################

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

############################
# DATADOG
############################

  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: datadog-agent
    restart: unless-stopped
    profiles: ["datadog"]
    environment:
      - DD_API_KEY=${DATADOG_API_KEY}
      - DD_SITE=${DATADOG_SITE}
      - DD_APM_ENABLED=true
      - DD_LOGS_ENABLED=true
      - DD_PROCESS_AGENT_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

############################
# VOLUMES
############################

volumes:
  postgres_data:
  grafana_data: