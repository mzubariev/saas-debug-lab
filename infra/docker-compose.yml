version: "3.9"

services:

############################
# DATABASE
############################

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

############################
# REDIS
############################

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

############################
# KAFKA
############################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    profiles: ["core"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

############################
# KAFKA UI
############################

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

############################
# API GATEWAY
############################

  api-gateway:
    build: ../services/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/api-gateway/.env
    ports:
      - "8000:8000"
    depends_on:
      task-service:
        condition: service_healthy
      auth-service:
        condition: service_started

############################
# SERVICES
############################

  auth-service:
    build: ../services/auth-service
    container_name: auth-service
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/auth-service/.env
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  task-service:
    build: ../services/task-service
    container_name: task-service
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/task-service/.env
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

############################
# WORKERS
############################

  notification-worker:
    build: ../workers/notification-worker
    container_name: notification-worker
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../workers/notification-worker/.env
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics-worker:
    build: ../workers/analytics-worker
    container_name: analytics-worker
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../workers/analytics-worker/.env
    depends_on:
      kafka:
        condition: service_healthy

############################
# FRONTENDS
############################

  react-frontend:
    build: ../frontends/react-dashboard
    container_name: react-frontend
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api-gateway

  nextjs-frontend:
    build: ../frontends/nextjs-dashboard
    container_name: nextjs-frontend
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api-gateway

############################
# REDIS INSIGHT
############################

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

############################
# JAEGER
############################

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

############################
# PROMETHEUS
############################

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

############################
# GRAFANA
############################

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

############################
# FLUENT BIT
############################

  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: fluent-bit
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      - elasticsearch

############################
# ELASTICSEARCH
############################

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"

############################
# KIBANA
############################

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

############################
# DATADOG
############################

  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: datadog-agent
    restart: unless-stopped
    profiles: ["datadog"]
    environment:
      - DD_API_KEY=${DATADOG_API_KEY}
      - DD_SITE=${DATADOG_SITE}
      - DD_APM_ENABLED=true
      - DD_LOGS_ENABLED=true
      - DD_PROCESS_AGENT_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

############################
# VOLUMES
############################

volumes:
  postgres_data:
  redis_data:
  grafana_data:
