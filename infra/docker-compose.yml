version: "3.9"

services:

############################
# DATABASE
############################

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

############################
# REDIS
############################

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

############################
# KAFKA
############################

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    profiles: ["core"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

############################
# KAFKA UI
############################

  kafka-ui:
    image: provectuslabs/kafka-ui
    container_name: kafka-ui
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

############################
# API GATEWAY
############################

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/api-gateway/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      # ── Datadog APM ──────────────────────────────────────────────────────
      DD_SERVICE: api-gateway
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"api-gateway"}]'
    # Port 8000 is intentionally NOT exposed to the host.
    # All external traffic must enter through Nginx on :80.
    depends_on:
      task-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

############################
# NGINX (reverse proxy + rate limiter)
############################

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "80:80"     # Sole host-facing entry point — replaces direct :8000 exposure
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

############################
# DB MIGRATIONS (one-shot init containers)
############################

  # Runs `alembic upgrade head` for auth-service, then exits.
  # auth-service waits for this to complete successfully before starting.
  auth-migrate:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-migrate
    profiles: ["core"]
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../services/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Runs `alembic upgrade head` for task-service, then exits.
  task-migrate:
    build:
      context: ..
      dockerfile: services/task-service/Dockerfile
    container_name: task-migrate
    profiles: ["core"]
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ../services/task-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

############################
# SERVICES
############################

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/auth-service/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      DD_SERVICE: auth-service
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"auth-service"}]'
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  task-service:
    build:
      context: ..
      dockerfile: services/task-service/Dockerfile
    container_name: task-service
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/task-service/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      DD_SERVICE: task-service
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"task-service"}]'
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      task-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

############################
# WEBHOOK SIMULATOR
############################

  webhook-simulator:
    build:
      context: ..
      dockerfile: services/webhook-simulator/Dockerfile
    container_name: webhook-simulator
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/webhook-simulator/.env
    ports:
      - "8004:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

############################
# INTEGRATION SERVICE
############################

  integration-service:
    build:
      context: ..
      dockerfile: services/integration-service/Dockerfile
    container_name: integration-service
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../services/integration-service/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      DD_SERVICE: integration-service
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"integration-service"}]'
    ports:
      - "8003:8000"
    depends_on:
      kafka:
        condition: service_healthy
      webhook-simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

############################
# MAILHOG (local SMTP catcher)
############################

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "8025:8025"   # Web UI — view captured emails at http://localhost:8025
    # Port 1025 is intentionally NOT exposed to the host; traffic goes through Toxiproxy.

############################
# TOXIPROXY (chaos proxy — sits between notification-worker and MailHog)
############################

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: toxiproxy
    restart: unless-stopped
    profiles: ["core"]
    command: ["-config", "/etc/toxiproxy.json", "-host", "0.0.0.0"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "8474:8474"   # Management API — inject/remove toxics here
      - "11025:11025" # mailhog-smtp proxy (notification-worker → this → mailhog:1025)
    depends_on:
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "toxiproxy-cli", "list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

############################
# WORKERS
############################

  scheduler-worker:
    build:
      context: ..
      dockerfile: workers/scheduler-worker/Dockerfile
    container_name: scheduler-worker
    restart: unless-stopped
    profiles: ["core"]
    # ddtrace-run is prepended here (no Dockerfile CMD to modify).
    # It auto-instruments Celery tasks, Redis, SQLAlchemy, and kafka-python.
    command: ["ddtrace-run", "celery", "-A", "app.celery:celery_app", "worker", "--beat", "--loglevel=info"]
    env_file:
      - ../workers/scheduler-worker/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      DD_SERVICE: scheduler-worker
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"scheduler-worker"}]'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  flower:
    build:
      context: ..
      dockerfile: workers/scheduler-worker/Dockerfile
    container_name: flower
    restart: unless-stopped
    profiles: ["core"]
    command: ["ddtrace-run", "celery", "-A", "app.celery:celery_app", "flower", "--port=5555"]
    env_file:
      - ../workers/scheduler-worker/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      DD_SERVICE: flower
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"flower"}]'
    ports:
      - "5555:5555"   # Flower UI — http://localhost:5555
    depends_on:
      - scheduler-worker

  notification-worker:
    build:
      context: ..
      dockerfile: workers/notification-worker/Dockerfile
    container_name: notification-worker
    restart: unless-stopped
    profiles: ["core"]
    env_file:
      - ../workers/notification-worker/.env
    environment:
      SENTRY_DSN: ${SENTRY_DSN:-}
      # ── Datadog APM ──────────────────────────────────────────────────────
      DD_SERVICE: notification-worker
      DD_ENV: ${DD_ENV:-dev}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: datadog-agent
      DD_LOGS_INJECTION: "true"
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
      # ── SMTP (via Toxiproxy) ──────────────────────────────────────────────
      # SMTP routes through Toxiproxy by default so network-level chaos can be injected
      # without touching this service. To use a real provider instead:
      #   SMTP_HOST=smtp.gmail.com SMTP_PORT=587 SMTP_USE_STARTTLS=true
      #   SMTP_USERNAME=you@gmail.com SMTP_PASSWORD=app-password
      SMTP_HOST: ${SMTP_HOST:-toxiproxy}
      SMTP_PORT: ${SMTP_PORT:-11025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USE_STARTTLS: ${SMTP_USE_STARTTLS:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    labels:
      com.datadoghq.ad.logs: '[{"source":"python","service":"notification-worker"}]'
    depends_on:
      kafka:
        condition: service_healthy
      toxiproxy:
        condition: service_healthy


############################
# FRONTENDS
############################

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: frontend
    restart: unless-stopped
    profiles: ["core"]
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost
      # Forward the host-level SENTRY_DSN so the browser SDK can report to the
      # same Sentry project as the backend.  Leave unset to disable Sentry.
      - VITE_SENTRY_DSN=${SENTRY_DSN:-}
      - VITE_SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-1.0}
    depends_on:
      - nginx


############################
# REDIS INSIGHT
############################

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

############################
# JAEGER
############################

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

############################
# PROMETHEUS
############################

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

############################
# GRAFANA
############################

  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro

############################
# FLUENT BIT
############################

  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: fluent-bit
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../observability/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
    depends_on:
      - elasticsearch

############################
# ELASTICSEARCH
############################

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    ports:
      - "9200:9200"

############################
# KIBANA
############################

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"

############################
# DATADOG
############################

  datadog-agent:
    image: gcr.io/datadoghq/agent:latest
    container_name: datadog-agent
    restart: unless-stopped
    profiles: ["datadog"]
    environment:
      # ── Identity ──────────────────────────────────────────────────────────
      DD_API_KEY: ${DD_API_KEY:-${DATADOG_API_KEY:-}}   # accept both naming conventions
      DD_SITE: ${DD_SITE:-datadoghq.com}

      # ── APM ───────────────────────────────────────────────────────────────
      DD_APM_ENABLED: "true"
      # Accept trace traffic from all containers on the Docker network,
      # not just the localhost loopback.  Required for container-to-agent APM.
      DD_APM_NON_LOCAL_TRAFFIC: "true"

      # ── Logs ──────────────────────────────────────────────────────────────
      DD_LOGS_ENABLED: "true"
      # Collect stdout/stderr logs from every container automatically.
      # Individual containers can be excluded via the
      #   com.datadoghq.ad.logs: '[{"source":"python","service":"<name>"}]'
      # Docker label if finer-grained source tagging is needed.
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"

      # ── DogStatsD ─────────────────────────────────────────────────────────
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"

      # ── Process / container metrics ───────────────────────────────────────
      DD_PROCESS_AGENT_ENABLED: "true"

      # ── Shared tags ───────────────────────────────────────────────────────
      DD_ENV: ${DD_ENV:-dev}
    ports:
      - "8126:8126"       # APM traces  (TCP)
      - "8125:8125/udp"   # DogStatsD   (UDP)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Process-level metrics require read access to the host's proc filesystem.
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro

############################
# VOLUMES
############################

volumes:
  postgres_data:
  redis_data:
  grafana_data:
