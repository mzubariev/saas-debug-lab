version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must stay on one version. A split major fails CodeQL.
      codeql:
        patterns:
          - "github/codeql-action/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directories:
      - "/testing"
      - "/shared"
    schedule:
      interval: "weekly"
    # 2.1 drops SQLAlchemyInstrumentor (BUG-10). Patch updates inside 2.0 still apply.
    ignore:
      - dependency-name: "sqlalchemy"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # 0.300+ and resources/sdk 3 need @opentelemetry/api 1.10.
    # sdk-trace 2.x needs api <1.10. One tree cannot install both.
    ignore:
      - dependency-name: "@opentelemetry/exporter-trace-otlp-http"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation-fetch"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation-xml-http-request"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/resources"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-trace-web"
        versions: [">=3.0.0"]
      # sdk-trace 2.x peers api <1.10. 1.10 belongs with the 0.300 line, which is ignored above.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@opentelemetry/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/frontend"
      - "/migrations"
      - "/services/core/api-gateway"
      - "/services/core/auth-service"
      - "/services/core/task-service"
      - "/services/core/webhook-dispatcher"
      - "/services/core/webhook-receiver"
      - "/services/external/external-service-simulator"
      - "/workers/notification-worker"
      - "/workers/scheduler-worker"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
