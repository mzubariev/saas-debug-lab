name: smoke

on:
  workflow_call:
    inputs:
      smoke_base_url:
        description: Stack URL (SMOKE_BASE_URL). Nginx on this runner when start_stack is true.
        required: true
        type: string
      start_stack:
        description: Build and start the test stack on this runner before the checks.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      smoke_base_url:
        description: Stack URL (SMOKE_BASE_URL)
        required: true
        type: string
      start_stack:
        description: Build and start the test stack on this runner before the checks.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: testing

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - uses: ./.github/actions/test-stack
        with:
          start: ${{ inputs.start_stack }}
          ensure-admin-token: true
      - run: uv run pytest tests/smoke -n 0 -q
        env:
          SMOKE_BASE_URL: ${{ inputs.smoke_base_url }}
