name: smoke

on:
  workflow_call:
    inputs:
      smoke_base_url:
        description: Stack URL (SMOKE_BASE_URL). Nginx on this runner when start_stack is true.
        required: true
        type: string
      start_stack:
        description: Build and start the test stack on this runner before the checks.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      smoke_base_url:
        description: Stack URL (SMOKE_BASE_URL)
        required: true
        type: string
      start_stack:
        description: Build and start the test stack on this runner before the checks.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

defaults:
  run:
    working-directory: testing

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy env examples
        if: inputs.start_stack
        working-directory: ${{ github.workspace }}
        run: |
          git ls-files '*.env.example' | while read -r example; do
            case "$example" in testing/*) continue ;; esac
            cp "$example" "${example%.example}"
          done
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.start_stack
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        if: inputs.start_stack
        with:
          files: |
            infra/docker-compose.yml
            infra/docker-compose.test.yml
          targets: |
            migrations
            auth-service
            task-service
            webhook-receiver
            webhook-dispatcher
            external-service-simulator
            notification-worker
            scheduler-worker
            api-gateway
            frontend
          load: true
          provenance: false
          allow: fs.read=*
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Start the test stack
        if: inputs.start_stack
        working-directory: ${{ github.workspace }}/infra
        run: |
          mapfile -t services < <(grep -vE '^(#|[[:space:]]*$)' test-stack.services)
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --no-build --remove-orphans "${services[@]}"
      - name: Wait until each service kind is ready
        if: inputs.start_stack
        run: |
          uv run python - <<'PY'
          from saas_testkit.infra import Stack, ensure_admin_token
          from saas_testkit.infra.compose import _postgres_ready, _require, _wait_ready, _wait_until

          _wait_until(_postgres_ready, "postgres")
          _require("up", "-d", "--force-recreate", "--no-deps", "migrations", timeout=180)
          _wait_ready()
          ensure_admin_token(Stack(base_url="http://127.0.0.1:8001", nginx_url="http://127.0.0.1", owned=False))
          PY
      - run: uv run pytest tests/smoke -n 0 -q
        env:
          SMOKE_BASE_URL: ${{ inputs.smoke_base_url }}
