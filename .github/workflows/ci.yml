name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: testing

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check --select S .
      - run: |
          uv export --locked --all-groups --no-emit-package saas-shared --no-hashes --no-emit-project > /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest tests/unit -n auto -q --junitxml=reports/junit-unit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-unit
          path: testing/reports/junit-unit.xml

  component-contract:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - task-service
          - auth-service
          - api-gateway
          - webhook-receiver
          - external-service-simulator
    env:
      TEST_PG_URL: postgresql://postgres:test@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      TEST_KAFKA_BOOTSTRAP: localhost:9092
      SCHEMA_EXAMPLES: ${{ github.event_name == 'schedule' && '500' || '40' }}
      COVERAGE_FILE: .coverage.${{ matrix.service }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        command: >-
          redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned
          --kafka-addr plaintext://0.0.0.0:9092
          --advertise-kafka-addr plaintext://localhost:9092
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked --group ${{ matrix.service }}
      - id: svc
        run: echo "path=$(uv run python -c 'from saas_testkit.config import SERVICES; print(SERVICES["${{ matrix.service }}"].path)')" >> "$GITHUB_OUTPUT"
      - name: Wait for Redpanda
        run: timeout 60 bash -c 'until (echo > /dev/tcp/localhost/9092) 2>/dev/null; do sleep 1; done'
      - run: >-
          uv run pytest tests/component tests/contract/http --service ${{ matrix.service }}
          -n auto -q --cov=../${{ steps.svc.outputs.path }} --cov-report=
          --junitxml=reports/junit-${{ matrix.service }}.xml
      - if: matrix.service == 'task-service'
        run: uv run pytest tests/contract/events -q --junitxml=reports/junit-events.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports-${{ matrix.service }}
          path: |
            testing/reports/junit-${{ matrix.service }}.xml
            testing/.coverage.${{ matrix.service }}
          include-hidden-files: true
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.service }}
          path: testing/reports/junit-${{ matrix.service }}.xml
          reporter: java-junit
          use-actions-summary: true

  ci-gate:
    if: always()
    needs: [lint, security, unit, component-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was legitimately skipped
        working-directory: ${{ github.workspace }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
