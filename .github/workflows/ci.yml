name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: testing

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check --select S .
      - run: |
          uv export --locked --all-groups --no-emit-package saas-shared --no-hashes --no-emit-project > /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt --no-deps --disable-pip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest tests/unit -n auto -q --junitxml=reports/junit-unit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-unit
          path: testing/reports/junit-unit.xml

  component-contract:
    needs: [lint, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - task-service
          - auth-service
          - api-gateway
          - webhook-receiver
          - external-service-simulator
    env:
      TEST_PG_URL: postgresql://postgres:test@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379
      TEST_KAFKA_BOOTSTRAP: localhost:9092
      SCHEMA_EXAMPLES: "40"
      COVERAGE_FILE: .coverage.${{ matrix.service }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
        command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v26.2.2
        command: >-
          redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned
          --kafka-addr plaintext://0.0.0.0:9092
          --advertise-kafka-addr plaintext://localhost:9092
        ports:
          - 9092:9092
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked --group ${{ matrix.service }}
      - id: svc
        run: echo "path=$(uv run python -c 'from saas_testkit.config import SERVICES; print(SERVICES["${{ matrix.service }}"].path)')" >> "$GITHUB_OUTPUT"
      - name: Wait for Redpanda
        run: timeout 60 bash -c 'until (echo > /dev/tcp/localhost/9092) 2>/dev/null; do sleep 1; done'
      - run: >-
          uv run pytest tests/component tests/contract/http --service ${{ matrix.service }}
          -n auto -q --cov=../${{ steps.svc.outputs.path }} --cov-report=
          --junitxml=reports/junit-${{ matrix.service }}.xml
      - if: ${{ !cancelled() && matrix.service == 'task-service' }}
        run: uv run pytest tests/contract/events -q --junitxml=reports/junit-events.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports-${{ matrix.service }}
          path: |
            testing/reports/junit-${{ matrix.service }}.xml
            testing/.coverage.${{ matrix.service }}
            testing/reports/junit-events.xml
          include-hidden-files: true
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.service }}
          path: testing/reports/junit-${{ matrix.service }}.xml
          reporter: java-junit
          use-actions-summary: true
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() && matrix.service == 'task-service' }}
        with:
          name: junit-events
          path: testing/reports/junit-events.xml
          reporter: java-junit
          use-actions-summary: true

  integration:
    needs: [lint, security, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      COMPOSE_PROJECT_NAME: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy env examples
        working-directory: ${{ github.workspace }}
        run: |
          git ls-files '*.env.example' | while read -r example; do
            case "$example" in testing/*) continue ;; esac
            cp "$example" "${example%.example}"
          done
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: |
            infra/docker-compose.yml
            infra/docker-compose.test.yml
          targets: |
            migrations
            auth-service
            task-service
            webhook-receiver
            webhook-dispatcher
            external-service-simulator
            notification-worker
            scheduler-worker
            api-gateway
            frontend
          load: true
          provenance: false
          allow: fs.read=*
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Start the test stack
        working-directory: ${{ github.workspace }}/infra
        run: |
          mapfile -t services < <(grep -vE '^(#|[[:space:]]*$)' test-stack.services)
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --no-build --remove-orphans "${services[@]}"
      - name: Wait until each service kind is ready
        run: |
          uv run python - <<'PY'
          from saas_testkit.adapters.wiremock import WireMockSink
          from saas_testkit.infra.compose import _postgres_ready, _require, _wait_ready, _wait_until

          _wait_until(_postgres_ready, "postgres")
          _require("up", "-d", "--force-recreate", "--no-deps", "migrations", timeout=180)
          _wait_ready()
          WireMockSink("http://127.0.0.1:8089").install_catch_all()
          PY
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testing/.test_durations
          key: durations-${{ runner.os }}-${{ github.run_id }}
          restore-keys: durations-${{ runner.os }}-
      - name: Integration tests
        env:
          BASE_URL: http://127.0.0.1:8001
        run: |
          mkdir -p reports
          uv run pytest tests/integration -n 3 --dist loadgroup -q \
            --splits ${{ strategy.job-total }} --group ${{ matrix.shard }} \
            --durations-path .test_durations \
            --junitxml=reports/junit-integration-${{ matrix.shard }}.xml \
            ${{ github.event_name == 'pull_request' && '-m "not slow and not chaos"' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-integration-${{ matrix.shard }}
          path: testing/reports/junit-integration-${{ matrix.shard }}.xml
      - name: Compose logs
        if: failure()
        working-directory: ${{ github.workspace }}/infra
        run: |
          mkdir -p "${{ github.workspace }}/testing/reports"
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > "${{ github.workspace }}/testing/reports/compose.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: integration-logs-${{ matrix.shard }}
          path: testing/reports/compose.log
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: junit-integration-${{ matrix.shard }}
          path: testing/reports/junit-integration-${{ matrix.shard }}.xml
          reporter: java-junit
          use-actions-summary: true

  smoke:
    needs: [lint, security, unit]
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/smoke.yml
    with:
      smoke_base_url: http://127.0.0.1
      start_stack: true

  ui-e2e:
    needs: [lint, security, unit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    env:
      COMPOSE_PROJECT_NAME: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy env examples
        working-directory: ${{ github.workspace }}
        run: |
          git ls-files '*.env.example' | while read -r example; do
            case "$example" in testing/*) continue ;; esac
            cp "$example" "${example%.example}"
          done
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - id: pw
        run: echo "version=$(uv run python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: uv run playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7.4.0
        with:
          files: |
            infra/docker-compose.yml
            infra/docker-compose.test.yml
          targets: |
            migrations
            auth-service
            task-service
            webhook-receiver
            webhook-dispatcher
            external-service-simulator
            notification-worker
            scheduler-worker
            api-gateway
            frontend
          load: true
          provenance: false
          allow: fs.read=*
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Start the test stack
        working-directory: ${{ github.workspace }}/infra
        run: |
          mapfile -t services < <(grep -vE '^(#|[[:space:]]*$)' test-stack.services)
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --no-build --remove-orphans "${services[@]}"
      - name: Wait until each service kind is ready
        run: |
          uv run python - <<'PY'
          from saas_testkit.adapters.wiremock import WireMockSink
          from saas_testkit.infra.compose import _postgres_ready, _require, _wait_ready, _wait_until

          _wait_until(_postgres_ready, "postgres")
          _require("up", "-d", "--force-recreate", "--no-deps", "migrations", timeout=180)
          _wait_ready()
          WireMockSink("http://127.0.0.1:8089").install_catch_all()
          PY
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testing/.test_durations
          key: durations-${{ runner.os }}-${{ github.run_id }}
          restore-keys: durations-${{ runner.os }}-
      - name: UI tests
        env:
          BASE_URL: http://127.0.0.1:8001
        run: |
          mkdir -p reports
          uv run pytest tests/e2e_ui -n 2 -q \
            --splits ${{ strategy.job-total }} --group ${{ matrix.shard }} \
            --durations-path .test_durations \
            --tracing retain-on-failure --screenshot only-on-failure --video off \
            --junitxml=reports/junit-e2e-${{ matrix.shard }}.xml \
            ${{ github.event_name == 'pull_request' && '-m critical' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-e2e-traces-${{ matrix.shard }}
          path: testing/test-results/
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        working-directory: ${{ github.workspace }}/infra
        run: |
          mkdir -p "${{ github.workspace }}/testing/reports"
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color > "${{ github.workspace }}/testing/reports/compose.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-e2e-logs-${{ matrix.shard }}
          path: testing/reports/compose.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-e2e-${{ matrix.shard }}
          path: testing/reports/junit-e2e-${{ matrix.shard }}.xml
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: junit-e2e-${{ matrix.shard }}
          path: testing/reports/junit-e2e-${{ matrix.shard }}.xml
          reporter: java-junit
          use-actions-summary: true

  coverage:
    needs: [component-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: testing/uv.lock
          python-version: "3.14"
      - run: uv sync --locked
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: reports-*
          path: testing/coverage-parts
          merge-multiple: true
      - run: uv run coverage combine coverage-parts && uv run coverage report

  ci-gate:
    if: always()
    needs: [lint, security, unit, component-contract, integration, smoke, ui-e2e, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every needed job succeeded or was legitimately skipped
        working-directory: ${{ github.workspace }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
